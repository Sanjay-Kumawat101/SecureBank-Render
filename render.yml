databases:
  - name: securebank-db
    databaseName: securebank
    user: securebank
    plan: free
    region: oregon
    ipAllowList: []          # internal connections only

services:
  - type: web
    name: securebank
    runtime: node
    plan: free
    region: oregon           # must match the database region
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm ci
    startCommand: cd backend && npm run db:setup && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: securebank-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOW_VULNERABLE_MODE   # only used if the optional gating change is applied
        value: "false"